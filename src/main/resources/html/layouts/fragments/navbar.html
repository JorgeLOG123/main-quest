<nav id="nav" th:fragment="nav" xmlns:th="http://www.thymeleaf.org" class="navbar navbar-expand-lg mq-navbar">
    <div class="container">
        <a class="mq-brand" th:href="@{/}">
            <div class="mq-brand-icon">MQ</div>
            <span class="mq-brand-text" th:text="#{navbar.brand}">Main Quest</span>
        </a>

        <div class="d-flex align-items-center gap-2 ms-auto">
            <!-- Status badge -->
            <span class="status-badge d-none d-xl-inline-flex me-2">
                <span class="status-dot"></span>
                <span th:text="#{navbar.status.connected}">Spring Boot :8080 Conectado</span>
            </span>

            <!-- Administración -->
            <a class="btn btn-mq-ghost btn-sm" th:href="@{/admin/user/list}" th:aria-label="#{navbar.admin}">
                <i class="fa-solid fa-gear"></i> <span class="d-none d-md-inline" th:text="#{navbar.admin}">Administración</span>
            </a>

            <!-- Links de navegación para visitantes (sin login) -->
            <a class="btn btn-mq-ghost btn-sm" th:href="@{/login}" th:aria-label="#{navbar.btn.login}">
                <i class="fa-solid fa-right-to-bracket"></i> <span class="d-none d-sm-inline" th:text="#{navbar.btn.login}">Ingresar</span>
            </a>
            <a class="btn btn-mq-soft btn-sm" th:href="@{/registro}" th:aria-label="#{navbar.btn.register}">
                <i class="fa-solid fa-user-plus"></i> <span class="d-none d-sm-inline" th:text="#{navbar.btn.register}">Registrarse</span>
            </a>

            <!-- Jugar (lleva al GameController, que decide si deja pasar o manda al login) -->
            <a class="btn btn-mq-primary btn-sm" th:href="@{/game}" th:aria-label="#{navbar.btn.play}">
                <i class="fa-solid fa-play"></i> <span class="d-none d-sm-inline" th:text="#{navbar.btn.play}">Jugar</span>
            </a>
        </div>
    </div>
</nav>
