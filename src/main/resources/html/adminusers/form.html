<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/default}">
<head>
    <title th:text="${form.esCreacion()} ? #{admin.users.form.title} : #{admin.users.form.edit.title}">Main Quest — Nuevo jugador</title>
</head>
<body>

<div layout:fragment="page-content">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">

            <h2 class="text-light mb-4"
                th:text="${form.esCreacion()} ? #{admin.users.form.section.title} : #{admin.users.form.edit.title}">
                Creación de jugador
            </h2>

            <form th:action="@{/admin/user/save}" method="post" th:object="${form}">
                <input type="hidden" th:field="*{id}">
                <div class="mb-3">
                    <label class="form-label text-light small" th:text="#{common.label.playerName}">Nombre de Jugador</label>
                    <input type="text" th:field="*{nombre}" class="form-control bg-secondary bg-opacity-20 border-secondary text-light" th:errorclass="is-invalid" required="required">
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}"></div>
                </div>

                <div class="mb-3">
                    <label class="form-label text-light small" th:text="#{common.label.email}">Correo Electrónico</label>
                    <input type="email" th:field="*{email}" class="form-control bg-secondary bg-opacity-20 border-secondary text-light" th:errorclass="is-invalid" required="required">
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
                </div>

                <div class="mb-4">
                    <label class="form-label text-light small" th:text="#{common.label.password}">Contraseña</label>
                    <input type="password" th:field="*{contrasena}" class="form-control bg-secondary bg-opacity-20 border-secondary text-light" th:errorclass="is-invalid" th:minlength="${form.contrasenaMinLength}" th:required="${form.esCreacion()}">
                    <small class="text-light" th:unless="${form.esCreacion()}" th:text="#{contrasena.edit.hint}">Dejalo vacío para no cambiarla</small>
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('contrasena')}" th:errors="*{contrasena}"></div>
                </div>

                <div class="d-flex gap-2">
                    <button type="submit" class="btn-mq-primary" th:text="#{guardar.btn}">Guardar</button>
                    <a th:href="@{/admin/user/list}" class="btn btn-outline-light" th:text="#{cancelar.btn}">Cancelar</a>
                </div>

            </form>

        </div>
    </div>
</div>

</body>
</html>
