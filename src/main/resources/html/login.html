<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/default}">
<head>
    <title th:text="#{login.title}">Main Quest — Iniciar Sesión</title>
</head>
<body>

<div layout:fragment="page-content">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <form th:action="@{/login}" method="post" th:object="${form}">

                <div class="mb-3">
                    <label class="form-label text-muted small" th:text="#{common.label.email}">Correo Electrónico</label>
                    <input type="email" th:field="*{email}" class="form-control bg-secondary bg-opacity-20 border-secondary text-light" th:errorclass="is-invalid" placeholder="jorge@email.com" th:placeholder="#{common.placeholder.email}" required>
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
                </div>

                <div class="mb-4">
                    <label class="form-label text-muted small" th:text="#{common.label.password}">Contraseña</label>
                    <input type="password" th:field="*{contrasena}" class="form-control bg-secondary bg-opacity-20 border-secondary text-light" th:errorclass="is-invalid" minlength="5" placeholder="••••••••" th:placeholder="#{common.placeholder.password}" required>
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('contrasena')}" th:errors="*{contrasena}"></div>
                </div>

                <button type="submit" class="btn-mq-primary w-100 justify-content-center" th:text="#{login.form.btn.submit}">Iniciar Sesión</button>

                <div class="text-center mt-3">
                    <a th:href="@{/registro}" class="text-muted small" th:text="#{login.link.no.account}">¿No tenés cuenta? Registrate</a>
                </div>
            </form>
        </div>
    </div>
</div>

</body>
</html>
